name: Diagnose Cloud Run live playback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-live-playback.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: diagnose-cloud-run-live-playback
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      ${{ vars.GCP_PROJECT_ID != '' &&
          vars.GCP_REGION != '' &&
          vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
          vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' &&
          vars.GCP_RUNTIME_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROD_SERVICE: tw-news-m3u

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Probe every news channel with the production 4GTV cache
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          set -Eeuo pipefail

          DIAG_SERVICE="tw-news-diag-${GITHUB_RUN_ID}"
          ACCESS_KEY="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(24))
          PY
          )"
          echo "::add-mask::$ACCESS_KEY"

          cleanup() {
            gcloud run services delete "$DIAG_SERVICE" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          IMAGE="$(gcloud run services describe "$PROD_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(spec.template.spec.containers[0].image)')"
          [[ -n "$IMAGE" ]] || { echo "Unable to find production image"; exit 1; }

          echo "Production image: ${IMAGE%%@*}@<digest>"
          echo "Creating isolated diagnostic service with the current production 4GTV cache"

          gcloud run deploy "$DIAG_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SA" \
            --port 8080 \
            --cpu 2 \
            --memory 4Gi \
            --concurrency 8 \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 300 \
            --execution-environment gen2 \
            --ingress all \
            --no-invoker-iam-check \
            --no-iap \
            --default-url \
            --set-secrets "/var/secrets/fourgtv/streams.json=tw-news-fourgtv-streams:latest" \
            --set-env-vars "ACCESS_KEY=${ACCESS_KEY},FOURGTV_CACHE_FILE=/var/secrets/fourgtv/streams.json,MAX_HEIGHT=480,RESOLVER_TIMEOUT_SECONDS=55,MAX_RESOLVER_CONCURRENCY=8,RESOLVER_FAILURE_TTL_SECONDS=10,UPSTREAM_TIMEOUT_SECONDS=30,LOG_LEVEL=INFO,TZ=Asia/Taipei" \
            --quiet

          SERVICE_URL="$(gcloud run services describe "$DIAG_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          echo "Diagnostic URL: $SERVICE_URL"

          echo
          echo "=== Application readiness ==="
          curl --fail --silent --show-error --retry 8 --retry-delay 3 \
            "$SERVICE_URL/api/config"
          echo

          export SERVICE_URL ACCESS_KEY
          echo
          echo "=== Concurrent resolver probes for all configured news channels ==="
          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          service = os.environ["SERVICE_URL"].rstrip("/")
          key = os.environ["ACCESS_KEY"]
          channels = [
              "ftv-news", "pts-news", "tvbs-news", "setn-news",
              "ctitv-news", "ebc-news", "global-news-tw", "era-news",
          ]

          def sanitize(value):
              text = str(value or "")
              text = re.sub(r"([?&](?:key|token|sig|signature|expire|expires)=[^&\s\"']+)", "<redacted>", text, flags=re.I)
              text = re.sub(r"https://[^\s|]+", lambda m: m.group(0).split("?", 1)[0], text)
              return text[:3000]

          def probe(channel):
              req = urllib.request.Request(
                  f"{service}/api/channels/{channel}/probe",
                  method="POST",
                  headers={"X-Access-Key": key, "User-Agent": "tw-news-diagnostic/1"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=100) as response:
                      code = response.status
                      body = response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  code = exc.code
                  body = exc.read().decode("utf-8", errors="replace")
              except Exception as exc:
                  return {"channel": channel, "http": 0, "ok": False, "error": sanitize(exc)}
              try:
                  payload = json.loads(body)
              except Exception:
                  payload = {"error": body}
              return {
                  "channel": channel,
                  "http": code,
                  "ok": code == 200 and bool(payload.get("ok", True)),
                  "title": payload.get("title"),
                  "height": payload.get("height"),
                  "error": sanitize(payload.get("error") or payload.get("detail") or ""),
              }

          with concurrent.futures.ThreadPoolExecutor(max_workers=len(channels)) as pool:
              results = list(pool.map(probe, channels))

          print(json.dumps(results, ensure_ascii=False, indent=2))
          print("SUMMARY", json.dumps({
              "total": len(results),
              "ok": sum(bool(item["ok"]) for item in results),
              "failed": sum(not bool(item["ok"]) for item in results),
          }, ensure_ascii=False))
          PY

          echo
          echo "=== Resolver state and selected upstream source ==="
          curl --fail --silent --show-error \
            --header "X-Access-Key: $ACCESS_KEY" \
            "$SERVICE_URL/api/status" > /tmp/status.json
          python3 - <<'PY'
          import json
          import re

          data = json.load(open('/tmp/status.json', encoding='utf-8'))
          print('Status summary:', data.get('summary'))
          for item in data.get('channels', []):
              error = str(item.get('error') or '')
              error = re.sub(r'https://[^\s|]+', lambda m: m.group(0).split('?', 1)[0], error)
              print(json.dumps({
                  'id': item.get('id'),
                  'state': item.get('state'),
                  'source': item.get('source'),
                  'error': error[:2000],
              }, ensure_ascii=False))
          PY

          echo
          echo "=== Relevant Cloud Run container logs ==="
          gcloud run services logs read "$DIAG_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --limit 300 2>/dev/null \
            | grep -Ei 'cache unavailable|resolved |unable to resolve|fourgtv|youtube|confirm|403|expired|過期|失敗' \
            | tail -160 || true
