name: Diagnose Cloud Run live playback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-live-playback.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: diagnose-cloud-run-live-playback
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      ${{ vars.GCP_PROJECT_ID != '' &&
          vars.GCP_REGION != '' &&
          vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
          vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' &&
          vars.GCP_RUNTIME_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROD_SERVICE: tw-news-m3u

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Trace resolver, HLS manifests, and first media bytes
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          set -Eeuo pipefail

          DIAG_SERVICE="tw-news-diag-${GITHUB_RUN_ID}"
          ACCESS_KEY="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(24))
          PY
          )"
          echo "::add-mask::$ACCESS_KEY"

          cleanup() {
            gcloud run services delete "$DIAG_SERVICE" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          IMAGE="$(gcloud run services describe "$PROD_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(spec.template.spec.containers[0].image)')"
          [[ -n "$IMAGE" ]] || { echo "Unable to find production image"; exit 1; }

          echo "Production image: ${IMAGE%%@*}@<digest>"
          echo "Creating isolated diagnostic service with the current production 4GTV cache"

          gcloud run deploy "$DIAG_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SA" \
            --port 8080 \
            --cpu 2 \
            --memory 4Gi \
            --concurrency 8 \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 300 \
            --execution-environment gen2 \
            --ingress all \
            --no-invoker-iam-check \
            --no-iap \
            --default-url \
            --set-secrets "/var/secrets/fourgtv/streams.json=tw-news-fourgtv-streams:latest" \
            --set-env-vars "ACCESS_KEY=${ACCESS_KEY},FOURGTV_CACHE_FILE=/var/secrets/fourgtv/streams.json,MAX_HEIGHT=480,RESOLVER_TIMEOUT_SECONDS=55,MAX_RESOLVER_CONCURRENCY=8,RESOLVER_FAILURE_TTL_SECONDS=10,UPSTREAM_TIMEOUT_SECONDS=30,LOG_LEVEL=INFO,TZ=Asia/Taipei" \
            --quiet

          SERVICE_URL="$(gcloud run services describe "$DIAG_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          echo "Diagnostic URL: $SERVICE_URL"

          curl --fail --silent --show-error --retry 8 --retry-delay 3 \
            "$SERVICE_URL/api/config"
          echo

          export SERVICE_URL ACCESS_KEY
          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          SERVICE = os.environ["SERVICE_URL"].rstrip("/")
          KEY = os.environ["ACCESS_KEY"]
          BASE_HEADERS = {
              "X-Access-Key": KEY,
              "User-Agent": "tw-news-diagnostic/2",
              "Cache-Control": "no-cache",
          }

          def sanitize(value):
              text = str(value or "")
              text = re.sub(
                  r"([?&](?:key|token|sig|signature|expire|expires)=[^&\s\"']+)",
                  "<redacted>", text, flags=re.I,
              )
              text = re.sub(
                  r"https://[^\s|]+",
                  lambda match: match.group(0).split("?", 1)[0],
                  text,
              )
              return text[:3000]

          def fetch(url, *, method="GET", max_bytes=262144, timeout=100):
              request = urllib.request.Request(
                  url,
                  method=method,
                  headers=BASE_HEADERS,
              )
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      body = response.read(max_bytes)
                      return {
                          "http": response.status,
                          "content_type": response.headers.get("Content-Type", ""),
                          "content_length": response.headers.get("Content-Length", ""),
                          "body": body,
                          "effective_url": response.geturl(),
                      }
              except urllib.error.HTTPError as exc:
                  return {
                      "http": exc.code,
                      "content_type": exc.headers.get("Content-Type", ""),
                      "content_length": exc.headers.get("Content-Length", ""),
                      "body": exc.read(max_bytes),
                      "effective_url": url,
                  }
              except Exception as exc:
                  return {
                      "http": 0,
                      "content_type": "",
                      "content_length": "",
                      "body": str(exc).encode(),
                      "effective_url": url,
                  }

          status_result = fetch(f"{SERVICE}/api/status", max_bytes=1024 * 1024)
          status_payload = json.loads(status_result["body"].decode("utf-8"))
          channels = [item["id"] for item in status_payload.get("channels", [])]
          print("CONFIGURED_CHANNELS", json.dumps(channels, ensure_ascii=False))

          def probe(channel):
              result = fetch(
                  f"{SERVICE}/api/channels/{channel}/probe",
                  method="POST",
                  max_bytes=1024 * 1024,
              )
              text = result["body"].decode("utf-8", errors="replace")
              try:
                  payload = json.loads(text)
              except Exception:
                  payload = {"error": text}
              return {
                  "channel": channel,
                  "http": result["http"],
                  "ok": result["http"] == 200 and bool(payload.get("ok", True)),
                  "title": payload.get("title"),
                  "height": payload.get("height"),
                  "error": sanitize(payload.get("error") or payload.get("detail") or ""),
              }

          with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, len(channels))) as pool:
              probe_results = list(pool.map(probe, channels))

          print("PROBE_RESULTS")
          print(json.dumps(probe_results, ensure_ascii=False, indent=2))

          def first_uri(manifest_text, current_url):
              for raw in manifest_text.splitlines():
                  line = raw.strip()
                  if line and not line.startswith("#"):
                      return urllib.parse.urljoin(current_url, line)
              return None

          def trace_hls(channel):
              current_url = f"{SERVICE}/hls/{channel}/master.m3u8"
              levels = []
              for depth in range(4):
                  result = fetch(current_url, max_bytes=512 * 1024, timeout=120)
                  body = result["body"]
                  content_type = result["content_type"]
                  is_manifest = body.lstrip().startswith(b"#EXTM3U")
                  level = {
                      "depth": depth,
                      "http": result["http"],
                      "content_type": content_type,
                      "declared_length": result["content_length"],
                      "bytes_read": len(body),
                      "is_manifest": is_manifest,
                  }
                  if result["http"] not in (200, 206):
                      level["error_body"] = sanitize(body.decode("utf-8", errors="replace"))
                      levels.append(level)
                      return {"channel": channel, "ok": False, "levels": levels}
                  levels.append(level)
                  if not is_manifest:
                      return {
                          "channel": channel,
                          "ok": len(body) > 0,
                          "levels": levels,
                      }
                  text = body.decode("utf-8", errors="replace")
                  next_url = first_uri(text, result["effective_url"])
                  if not next_url:
                      levels[-1]["error"] = "manifest has no media URI"
                      return {"channel": channel, "ok": False, "levels": levels}
                  current_url = next_url
              return {
                  "channel": channel,
                  "ok": False,
                  "levels": levels,
                  "error": "manifest nesting exceeded diagnostic limit",
              }

          online_channels = [item["channel"] for item in probe_results if item["ok"]]
          with concurrent.futures.ThreadPoolExecutor(max_workers=max(1, len(online_channels))) as pool:
              hls_results = list(pool.map(trace_hls, online_channels))

          print("HLS_RESULTS")
          print(json.dumps(hls_results, ensure_ascii=False, indent=2))
          print("SUMMARY", json.dumps({
              "configured": len(channels),
              "resolved": len(online_channels),
              "resolver_failed": len(channels) - len(online_channels),
              "hls_end_to_end_ok": sum(bool(item["ok"]) for item in hls_results),
              "hls_failed": sum(not bool(item["ok"]) for item in hls_results),
          }, ensure_ascii=False))
          PY

          echo
          echo "=== Relevant Cloud Run container logs ==="
          gcloud run services logs read "$DIAG_SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --limit 400 2>/dev/null \
            | grep -Ei 'cache unavailable|resolved |unable to resolve|fourgtv|youtube|confirm|403|404|502|expired|過期|失敗|upstream' \
            | tail -200 || true
