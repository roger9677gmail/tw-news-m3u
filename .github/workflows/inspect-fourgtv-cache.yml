name: Inspect 4GTV cache usability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-fourgtv-cache.yml"

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    if: >-
      ${{ vars.GCP_PROJECT_ID != '' &&
          vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
          vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Read cache safely and test each stream from GitHub runner
        shell: bash
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -Eeuo pipefail
          umask 077
          gcloud secrets versions access latest \
            --secret tw-news-fourgtv-streams \
            --project "$PROJECT_ID" > /tmp/fourgtv-cache.json

          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import UTC, datetime
          from pathlib import Path

          payload = json.loads(Path('/tmp/fourgtv-cache.json').read_text(encoding='utf-8'))
          now = datetime.now(tz=UTC)
          print('generated_at:', payload.get('generated_at'))
          print('tested_at:', now.isoformat())

          headers = {
              'User-Agent': '%E5%9B%9B%E5%AD%A3%E7%B7%9A%E4%B8%8A/1 CFNetwork/1568.200.51 Darwin/24.1.0',
              'Accept': '*/*',
              'Cache-Control': 'no-cache',
          }

          for channel_id, entry in (payload.get('channels') or {}).items():
              url = entry.get('url') if isinstance(entry, dict) else None
              expiry_raw = entry.get('expires_at') if isinstance(entry, dict) else None
              if not isinstance(url, str):
                  print(channel_id, 'missing_url')
                  continue
              parsed = urllib.parse.urlparse(url)
              query_keys = sorted(urllib.parse.parse_qs(parsed.query).keys())
              expiry = None
              if isinstance(expiry_raw, str):
                  try:
                      expiry = datetime.fromisoformat(expiry_raw.replace('Z', '+00:00'))
                  except ValueError:
                      pass
              if expiry is None:
                  values = urllib.parse.parse_qs(parsed.query)
                  epochs = [
                      int(value)
                      for key in ('expire', 'expires', 'expires1')
                      for value in values.get(key, [])
                      if str(value).isdigit()
                  ]
                  if epochs:
                      expiry = datetime.fromtimestamp(min(epochs), tz=UTC)

              request = urllib.request.Request(url, headers=headers)
              status = 0
              content_type = ''
              body = b''
              error = ''
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
                      content_type = response.headers.get('Content-Type', '')
                      body = response.read(262144)
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  content_type = exc.headers.get('Content-Type', '')
                  body = exc.read(262144)
              except Exception as exc:
                  error = f'{type(exc).__name__}: {exc}'

              result = {
                  'channel': channel_id,
                  'host': parsed.hostname,
                  'path_suffix': parsed.path[-80:],
                  'query_keys': query_keys,
                  'expiry': expiry.isoformat() if expiry else None,
                  'seconds_remaining': int((expiry - now).total_seconds()) if expiry else None,
                  'http': status,
                  'content_type': content_type,
                  'bytes_read': len(body),
                  'is_manifest': body.lstrip().startswith(b'#EXTM3U'),
                  'body_preview_hex': body[:16].hex(),
                  'error': error[:500],
              }
              print(json.dumps(result, ensure_ascii=False))
          PY

          rm -f /tmp/fourgtv-cache.json
